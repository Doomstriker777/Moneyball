[build]
  publish = "dist"
  command = "npm run build"

# Route API calls to backend deployment
[[redirects]]
  from = "/api/*"
  to = "https://moneyball-7rh5.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application fallback rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


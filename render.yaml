services:
  # ----------------------------------------------------------------------------
  # Moneyball / LedgerLine Core Banking Engine (Spring Boot 3 + Java 21)
  # ----------------------------------------------------------------------------
  - type: web
    name: ledgerline-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ledgerline-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ledgerline-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ledgerline-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ledgerline-frontend.onrender.com,https://moneyball.netlify.app,http://localhost:5173,http://localhost:3000"

  # ----------------------------------------------------------------------------
  # Living Ledger Frontend (Static Site / Nginx)
  # ----------------------------------------------------------------------------
  - type: static
    name: ledgerline-frontend
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /api/*
        destination: https://moneyball-7rh5.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Managed Database
  # ----------------------------------------------------------------------------
  - name: ledgerline-postgres
    databaseName: ledgerline
    user: postgres
    plan: free
    region: oregon

